<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ page.title }} | {{ site.title }}</title>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">

</head>
<body>
  <header>
    <h1><a href="{{ '/' | relative_url }}">{{ site.title }}</a></h1>
  </header>
  
  <div class="navbar">
    <a href="/">Embedded</a>
    <a href="/week1" class="{% if page.url == '/week1/' %}active{% endif %}">WEEK1</a>
    <a href="/week2" class="{% if page.url == '/week2/' %}active{% endif %}">WEEK2</a>
    <a href="/week3" class="{% if page.url == '/week3/' %}active{% endif %}">WEEK3</a>
  </div>
  <main>
    {{ content }}
  </main>

  <footer>
    <p>© {{ site.time | date: "%Y" }} {{ site.author }}</p>
  </footer>
</body>
</html>
