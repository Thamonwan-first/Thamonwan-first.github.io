<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title >{{ page.title }} | {{ site.title }}</title>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">

</head>
<body>
  <header style="display: flex; justify-content: center;">
    <h1>{{ site.title }}</h1>
  </header>
  <hr>
  <span class="navbar" style="display: flex; justify-content: center;margin: 10px 0;">
    <div href="/week2" class="{% if page.url == '/week2/' %}active{% endif %}">WEEK2</div>
    <div href="/week3" class="{% if page.url == '/week3/' %}active{% endif %}">WEEK3</div>
    <div href="/week4" class="{% if page.url == '/week4/' %}active{% endif %}">WEEK4</div>
    <div href="/week5" class="{% if page.url == '/week5/' %}active{% endif %}">WEEK5</div>
    <div href="/week6" class="{% if page.url == '/week6/' %}active{% endif %}">WEEK6</div>
    <div href="/week8" class="{% if page.url == '/week8/' %}active{% endif %}">WEEK8</div>
    <div href="/week9" class="{% if page.url == '/week9/' %}active{% endif %}">WEEK9</div>
    <div href="/week10" class="{% if page.url == '/week10/' %}active{% endif %}">WEEK10</div>
    <div href="/week11" class="{% if page.url == '/week11/' %}active{% endif %}">WEEK11</div>
    <div href="/week12" class="{% if page.url == '/week12/' %}active{% endif %}">WEEK12</div>
  </span>
  <main>
    {{ content }}
  </main>

  <footer>
    <p>© {{ site.time | date: "%Y" }} {{ site.author }}</p>
  </footer>
</body>
</html>
