<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title >{{ page.title }} | {{ site.title }}</title>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">

</head>
<body>
  <header style="display: flex; justify-content: center;">
    <h1>{{ site.title }}</h1>
  </header>
  <hr>
  <span class="navbar" style="display: flex; justify-content: center; margin : 24px;">
    <div style="background-color: bisque; border-radius: 16px;" href="/_layouts/week2.md" class="{% if page.url == '/week2/' %}active{% endif %}">WEEK2</div>
    <div style="background-color: bisque; border-radius: 16px;" href="/_layouts/week3.md" class="{% if page.url == '/week3/' %}active{% endif %}">WEEK3</div>
    <div style="background-color: bisque; border-radius: 16px;" href="/_layouts/week4.md" class="{% if page.url == '/week4/' %}active{% endif %}">WEEK4</div>
    <div style="background-color: bisque; border-radius: 16px;" href="/_layouts/week5.md" class="{% if page.url == '/week5/' %}active{% endif %}">WEEK5</div>
    <div style="background-color: bisque; border-radius: 16px;" href="/_layouts/week6.md" class="{% if page.url == '/week6/' %}active{% endif %}">WEEK6</div>
    <div style="background-color: bisque; border-radius: 16px;" href="/_layouts/week8.md" class="{% if page.url == '/week8/' %}active{% endif %}">WEEK8</div>
    <div style="background-color: bisque; border-radius: 16px;" href="/_layouts/week9.md" class="{% if page.url == '/week9/' %}active{% endif %}">WEEK9</div>
    <div style="background-color: bisque; border-radius: 16px;" href="/_layouts/week10.md" class="{% if page.url == '/week10/' %}active{% endif %}">WEEK10</div>
    <div style="background-color: bisque; border-radius: 16px;" href="/_layouts/week11.md" class="{% if page.url == '/week11/' %}active{% endif %}">WEEK11</div>
    <div style="background-color: bisque; border-radius: 16px;" href="/_layouts/week12.md" class="{% if page.url == '/week12/' %}active{% endif %}">WEEK12</div>
  </span>
  <main>
    {{ content }}
  </main>

  <footer>
    <p>© {{ site.time | date: "%Y" }} {{ site.author }}</p>
  </footer>
</body>
</html>
